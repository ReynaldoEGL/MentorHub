services:
  - type: web
    name: mentorhub-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: FRONTEND_URL
        sync: false
      - key: APP_TIMEZONE
        value: America/Mexico_City
      - key: CANCELLATION_MIN_HOURS
        value: "24"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: SMTP_FROM
        value: MentorHub <no-reply@example.com>
